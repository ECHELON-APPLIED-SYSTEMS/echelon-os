[package]
name = "echelon-storage-tests"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.90"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
httpdate = "=1.0.3"
jsonwebtoken = { version = "=9.3.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
