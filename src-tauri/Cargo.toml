[package]
name = "echelon-os"
version = "0.1.0"
description = "ECHELON OS desktop foundation"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "echelon_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3.0.12"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
httpdate = "=1.0.3"
jsonwebtoken = { version = "=9.3.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
