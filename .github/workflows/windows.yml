name: Continuous checks and on-demand Windows build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Clean frontend install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type checking
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Frontend production build
        run: npm run build
  desktop:
    name: Windows checks and portable ZIP
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-windows-build')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Clean frontend install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type checking
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Build unsigned portable Windows application
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          $stage = 'src-tauri/target/release/portable/ECHELON-OS'
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          Copy-Item 'src-tauri/target/release/echelon-os.exe' "$stage/echelon-os.exe" -ErrorAction Stop
          Copy-Item 'docs/PORTABLE.md' "$stage/README.txt" -ErrorAction Stop
          $files = @(Get-ChildItem $stage -Recurse -File)
          if ($files.Count -ne 2 -or (Test-Path "$stage/app-data")) { throw 'Unexpected portable payload' }
          if (($files | Measure-Object -Property Length -Sum).Sum -gt 50MB) { throw 'Portable payload exceeds 50 MiB guard' }
          Compress-Archive -Path $stage -DestinationPath 'src-tauri/target/release/portable/echelon-os-portable-windows-x64.zip' -ErrorAction Stop
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echelon-os-portable-windows-unsigned-${{ github.sha }}
          path: src-tauri/target/release/portable/echelon-os-portable-windows-x64.zip
          if-no-files-found: error
          retention-days: 1
