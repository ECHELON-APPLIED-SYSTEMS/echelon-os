name: Windows desktop

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows checks and unsigned installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Clean frontend install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type checking
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Build unsigned Windows application and NSIS installer
        run: npm run tauri -- build --bundles nsis --no-sign -- --locked
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echelon-os-windows-unsigned-${{ github.sha }}
          path: |
            src-tauri/target/release/echelon-os.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
